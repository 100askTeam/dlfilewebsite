server {
    listen 80;
    server_name dl.100ask.net;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name dl.100ask.net;

    ssl_certificate /etc/letsencrypt/live/dl.100ask.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dl.100ask.net/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    send_timeout 600s;

    location ~ ^/Tools/[a-z][a-z0-9_-]*/releases/[^/]+/[^/]+/[^/]+$ {
        root /home1/dlfile;
        autoindex off;
        default_type application/octet-stream;
        disable_symlinks on from=/home1/dlfile/Tools;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        limit_except GET { deny all; }
    }

    location ~ ^/releases/([a-z][a-z0-9_-]*)(/.*)?$ {
        return 308 /Tools/$1/releases$2;
    }

    location ~ ^/api/(upload|releases/upload)$ {
        client_max_body_size 20G;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location / {
        client_max_body_size 2M;
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering on;
    }
}
