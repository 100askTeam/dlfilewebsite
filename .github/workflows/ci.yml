name: Go source checks

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build static Linux binaries
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p build
          go build -trimpath -ldflags='-s -w' -o build/dladmin-go .
          go build -trimpath -ldflags='-s -w' -o build/dlctl ./cmd/dlctl
          file build/dladmin-go build/dlctl
