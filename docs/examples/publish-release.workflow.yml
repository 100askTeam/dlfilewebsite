name: Publish signed product release example

# This is documentation, not an active workflow. The release-producing repository
# must first build and sign all files in RELEASE_DIRECTORY.
on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Upload and stage a prebuilt release set
        uses: 100askTeam/dlfilewebsite/.github/actions/publish-release@release-publisher-v2
        with:
          release-directory: dist/release-set
          remote: ${{ secrets.DL_SSH_REMOTE }}
          ssh-private-key: ${{ secrets.DL_SSH_PRIVATE_KEY }}
          ssh-known-hosts: ${{ secrets.DL_SSH_KNOWN_HOSTS }}
          publish-now: 'false'
