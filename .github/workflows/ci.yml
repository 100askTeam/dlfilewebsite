name: Go source checks

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Test product-neutral Tauri release preparation
        run: node --test scripts/prepare_tauri_release_test.mjs
      - name: Verify restricted release command
        run: |
          bash -n deploy/ssh/dl-release-command
          bash deploy/ssh/dl-release-command --self-test
      - name: Test generic signed APT import
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev gnupg xz-utils
          bash -n deploy/apt/activate-apt-upload.sh
          python3 -m py_compile deploy/apt/verify-apt-upload.py
          bash scripts/apt-import-test.sh
      - name: Build static Linux binaries
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p build
          go build -trimpath -ldflags='-s -w' -o build/dladmin-go .
          go build -trimpath -ldflags='-s -w' -o build/dlctl ./cmd/dlctl
          file build/dladmin-go build/dlctl
      - name: Upload static Linux binaries
        uses: actions/upload-artifact@v4
        with:
          name: dladmin-go-linux-amd64-${{ github.sha }}
          path: |
            build/dladmin-go
            build/dlctl
          if-no-files-found: error
